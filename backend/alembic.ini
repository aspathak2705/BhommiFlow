# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; the default template is actually:
# file_template = %%(rev)s_%%(slug)s
# file_template = %%(year)d_%%(month)02d_%%(day)02d_%%(hour)02d%%(minute)02d-%%(rev)s_%%(slug)s

# sys.path path, space-separated, or source paths to add.
# prepend_sys_path = .
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to slugify
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be imported
# during the 'revision' command.
# allow_empty_history = false

# version locations - for support of multi-directory migrations
# version_locations = %(here)s/bar %(here)s/bat migrations/versions

# version path separator; defaults to os.pathsep.
# Use a space to allow version_locations to be colon-separated
# version_path_separator = :

# set to 'true' to search source files recursively
# recursive_version_locations = false

# output encoding
# output_encoding = utf-8

# sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for details.

# format using "black" - execute the command "black" on the newly generated file
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILE

# format using "ruff" - execute the command "ruff" on the newly generated file
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILE

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
